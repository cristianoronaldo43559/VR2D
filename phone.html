<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1.0"
>

<title>Phone Motion Controller</title>

<style>

body{

    margin:0;

    background:#080d18;

    color:white;

    font-family:Arial,sans-serif;

    text-align:center;

}

.container{

    max-width:700px;

    margin:auto;

    padding:18px;

}

input,button{

    padding:13px;

    margin:5px;

    border:none;

    border-radius:10px;

    font-size:17px;

}

input{

    width:220px;

}

button{

    background:#35d07f;

    font-weight:bold;

}

#calibrate{

    background:#3b82f6;

    color:white;

}

video{

    width:100%;

    max-width:640px;

    margin-top:15px;

    border-radius:16px;

    transform:scaleX(-1);

    background:black;

}

#status{

    background:#18213b;

    padding:12px;

    border-radius:10px;

    margin-top:10px;

}

#movement{

    font-size:40px;

    font-weight:bold;

    margin:15px;

}

#debug{

    background:#111a2d;

    padding:12px;

    border-radius:10px;

    font-size:16px;

    line-height:1.6;

}

</style>

</head>

<body>

<div class="container">

<h1>📱 Motion Controller</h1>

<p>Enter the PC code:</p>

<input
id="pcCode"
placeholder="PC code"
>

<button id="connect">
CONNECT
</button>

<br>

<button id="calibrate">
📍 CALIBRATE
</button>

<div id="status">
Starting...
</div>

<div id="movement">
WAITING
</div>

<div id="debug">
Body: waiting...
</div>

<video
id="camera"
autoplay
playsinline
muted
></video>

<p>

Stand in the middle.<br>

Move your whole body LEFT or RIGHT.

</p>

</div>


<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>


<script>


// ========================================
// ELEMENTS
// ========================================

const video=
document.getElementById("camera");

const statusText=
document.getElementById("status");

const movementText=
document.getElementById("movement");

const debugText=
document.getElementById("debug");

const pcCodeInput=
document.getElementById("pcCode");

const connectButton=
document.getElementById("connect");

const calibrateButton=
document.getElementById("calibrate");


// ========================================
// PEER
// ========================================

const peer=new Peer(
    "phone-"+Math.random().toString(36).substring(2,9)
);

let connection=null;


peer.on("open",function(){

    statusText.textContent=
        "📷 Camera ready";

});


peer.on("error",function(error){

    console.log(error);

    statusText.textContent=
        "❌ Peer error";

});


// ========================================
// CONNECT
// ========================================

connectButton.onclick=function(){

    const code=
        pcCodeInput.value.trim();

    if(!code){

        statusText.textContent=
            "⚠️ Enter PC code";

        return;

    }


    statusText.textContent=
        "Connecting...";


    connection=peer.connect(code);


    connection.on("open",function(){

        statusText.textContent=
            "🟢 PHONE CONNECTED";

        sendCommand("CENTER");

    });


    connection.on("close",function(){

        statusText.textContent=
            "🔴 Disconnected";

    });


    connection.on("error",function(error){

        console.log(error);

        statusText.textContent=
            "❌ Connection failed";

    });

};


// ========================================
// SEND COMMAND
// ========================================

let lastCommand="";

function sendCommand(command){

    if(!connection)
        return;

    if(!connection.open)
        return;


    connection.send(command);


    lastCommand=command;

    movementText.textContent=
        command;

}


// ========================================
// CALIBRATION
// ========================================

let calibrated=false;

let centerX=0;

let centerY=0;

let latestX=null;

let latestY=null;


calibrateButton.onclick=function(){

    if(latestX===null){

        statusText.textContent=
            "❌ Body not detected";

        return;

    }


    centerX=latestX;

    centerY=latestY;

    calibrated=true;


    statusText.textContent=
        "🟢 CALIBRATED — MOVE!";

    sendCommand("CENTER");

};


// ========================================
// MEDIAPIPE
// ========================================

const pose=new Pose({

    locateFile:function(file){

        return
        "https://cdn.jsdelivr.net/npm/@mediapipe/pose/"
        +file;

    }

});


pose.setOptions({

    modelComplexity:1,

    smoothLandmarks:true,

    enableSegmentation:false,

    minDetectionConfidence:0.5,

    minTrackingConfidence:0.5

});


let lastSend=0;


pose.onResults(function(results){

    const landmarks=
        results.poseLandmarks;


    if(!landmarks){

        debugText.innerHTML=
            "❌ BODY NOT DETECTED";

        return;

    }


    // shoulders
    const leftShoulder=
        landmarks[11];

    const rightShoulder=
        landmarks[12];


    // hips
    const leftHip=
        landmarks[23];

    const rightHip=
        landmarks[24];


    if(
        !leftShoulder ||
        !rightShoulder ||
        !leftHip ||
        !rightHip
    ){

        return;

    }


    // BODY CENTER
    const bodyX=
        (
            leftShoulder.x+
            rightShoulder.x+
            leftHip.x+
            rightHip.x
        )/4;


    const bodyY=
        (
            leftHip.y+
            rightHip.y
        )/2;


    latestX=bodyX;

    latestY=bodyY;


    debugText.innerHTML=

        "✅ BODY DETECTED<br>"+
        "X: "+bodyX.toFixed(3)+
        "<br>"+
        "Y: "+bodyY.toFixed(3)+
        "<br>"+
        "Center X: "+centerX.toFixed(3);


    if(!calibrated){

        movementText.textContent=
            "CALIBRATE";

        return;

    }


    const difference=
        bodyX-centerX;


    // ==================================
    // MOVEMENT
    // ==================================

    let command="CENTER";


    // IMPORTANT:
    // Camera image is mirrored visually,
    // so these are intentionally reversed.

    if(difference>0.07){

        command="LEFT";

    }

    else if(difference<-0.07){

        command="RIGHT";

    }

    else{

        command="CENTER";

    }


    // Don't spam too quickly

    const now=performance.now();


    if(
        command!==lastCommand ||
        now-lastSend>150
    ){

        sendCommand(command);

        lastSend=now;

    }

});


// ========================================
// CAMERA
// ========================================

navigator.mediaDevices.getUserMedia({

    video:{

        facingMode:"user",

        width:{
            ideal:640
        },

        height:{
            ideal:480
        }

    },

    audio:false

})

.then(function(stream){

    video.srcObject=stream;


    const camera=new Camera(video,{

        onFrame:async function(){

            await pose.send({
                image:video
            });

        },

        width:640,

        height:480

    });


    camera.start();


    statusText.textContent=
        "📷 Camera running";


})

.catch(function(error){

    console.log(error);

    statusText.textContent=
        "❌ Camera permission denied";

});


</script>

</body>

</html>
